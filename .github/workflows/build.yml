name: Build

on: [pull_request]

jobs:
  build:
    name: Build Gatsby site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install Project Dependencies
        run: yarn install

      - name: Build
        run: yarn build
