version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "00:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: "development"
        patterns:
          - "*"
      production:
        dependency-type: "production"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "00:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
